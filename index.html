<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoomable Sunburst — Interactive D3 Hierarchy Explorer</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .sunburst-svg {
      width: 100%;
      height: auto;
      max-width: 720px;
      display: block;
      margin: 0 auto;
      overflow: visible;
    }
    .arc-path {
      transition: filter 0.15s ease;
    }
    .arc-path:hover {
      filter: brightness(1.08) saturate(1.15);
    }
    .arc-dimmed {
      opacity: 0.22 !important;
    }
    .arc-highlighted {
      stroke: #0f172a;
      stroke-width: 1.5px;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-500 to-amber-400 flex items-center justify-center text-white shadow-sm">
          <i data-lucide="sun" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-semibold tracking-tight text-slate-900 leading-tight">Zoomable Sunburst</h1>
          <p class="text-xs text-slate-500">Click any arc to zoom in &middot; Click center to zoom out &middot; Hold <kbd class="px-1 py-0.5 bg-slate-100 border border-slate-300 rounded text-[10px] mono">Alt</kbd> for slow-mo</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <!-- Dataset Selector -->
        <div class="flex items-center gap-1.5">
          <label for="datasetSelect" class="text-xs font-medium text-slate-500 hidden sm:inline">Dataset:</label>
          <select id="datasetSelect" class="text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="flare">Flare Package Tree</option>
            <option value="budget">Tech Org Budget</option>
            <option value="energy">Clean Energy Mix</option>
          </select>
        </div>

        <!-- Palette Selector -->
        <div class="flex items-center gap-1.5">
          <label for="paletteSelect" class="text-xs font-medium text-slate-500 hidden sm:inline">Palette:</label>
          <select id="paletteSelect" class="text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="rainbow">Rainbow (Default)</option>
            <option value="turbo">Turbo</option>
            <option value="viridis">Viridis</option>
            <option value="warm">Warm</option>
            <option value="cool">Cool</option>
          </select>
        </div>

        <button id="openJsonBtn" type="button" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-medium px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition">
          <i data-lucide="code-2" class="w-4 h-4 text-indigo-600"></i>
          <span>Custom JSON</span>
        </button>

        <button id="exportSvgBtn" type="button" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-medium px-3 py-1.5 rounded-lg bg-slate-900 text-white hover:bg-slate-800 transition">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Export SVG</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

    <!-- Left/Center: Breadcrumb + Sunburst Chart -->
    <section class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 flex flex-col">
      <!-- Breadcrumb & Quick Actions -->
      <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-100">
        <nav id="breadcrumbNav" aria-label="Hierarchy Breadcrumb" class="flex flex-wrap items-center gap-1 text-xs sm:text-sm"></nav>
        <div class="flex items-center gap-2">
          <button id="slowMoToggle" type="button" aria-pressed="false" class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50 transition" title="Toggle 7.5s slow-motion transition">
            <i data-lucide="gauge" class="w-3.5 h-3.5"></i>
            <span>Slow-Mo: Off</span>
          </button>
          <button id="resetZoomBtn" type="button" class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-md bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition disabled:opacity-40 disabled:pointer-events-none">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            <span>Reset</span>
          </button>
        </div>
      </div>

      <!-- Chart Container -->
      <div id="chartContainer" class="relative w-full flex items-center justify-center py-2 select-none">
        <!-- SVG injected here -->
      </div>
    </section>

    <!-- Right: Search, Focused Node Stats & Children Breakdown -->
    <aside class="lg:col-span-4 flex flex-col gap-4">

      <!-- Search Box -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <label for="searchInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Find Node</label>
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input id="searchInput" type="text" placeholder="Search packages, modules, or items..." class="w-full pl-9 pr-8 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" />
          <button id="clearSearchBtn" type="button" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" aria-label="Clear search">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="searchResults" class="mt-2 max-h-40 overflow-y-auto divide-y divide-slate-100 hidden"></div>
      </div>

      <!-- Focused Node Card -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <div class="flex items-start justify-between gap-2 mb-3">
          <div>
            <span class="text-[11px] font-semibold uppercase tracking-wider text-indigo-600">Focused Node</span>
            <h2 id="focusName" class="text-lg font-bold text-slate-900 break-all">root</h2>
          </div>
          <span id="focusDepthBadge" class="text-xs font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 shrink-0">Depth 0</span>
        </div>

        <div class="grid grid-cols-2 gap-2.5 mb-4">
          <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-100">
            <div class="text-[11px] text-slate-500">Total Value</div>
            <div id="focusValue" class="text-base font-bold text-slate-900 mono">0</div>
          </div>
          <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-100">
            <div class="text-[11px] text-slate-500">Share of Root</div>
            <div id="focusShare" class="text-base font-bold text-indigo-600 mono">100%</div>
          </div>
        </div>

        <!-- Direct Children List -->
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Direct Segments</h3>
          <span id="childCount" class="text-xs text-slate-400 font-medium">0 items</span>
        </div>
        <div id="childrenList" class="space-y-1.5 max-h-72 overflow-y-auto pr-1"></div>
      </div>

    </aside>
  </main>

  <!-- Floating Tooltip -->
  <div id="tooltip" class="fixed z-50 pointer-events-none hidden bg-slate-900/95 text-white text-xs rounded-xl px-3 py-2 shadow-xl backdrop-blur-sm max-w-xs border border-slate-700/60">
    <div id="tooltipPath" class="text-slate-300 text-[11px] mb-1 break-all"></div>
    <div class="flex items-baseline justify-between gap-4">
      <span id="tooltipValue" class="font-bold text-sm mono text-white"></span>
      <span id="tooltipPercent" class="text-amber-300 font-semibold mono"></span>
    </div>
  </div>

  <!-- Custom JSON Modal -->
  <div id="jsonModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full flex flex-col max-h-[90vh]">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h3 class="text-base font-semibold text-slate-900">Load Custom Hierarchy JSON</h3>
          <p class="text-xs text-slate-500">Provide a root object with <code class="mono bg-slate-100 px-1 rounded">name</code>, <code class="mono bg-slate-100 px-1 rounded">children</code>, and leaf <code class="mono bg-slate-100 px-1 rounded">value</code> properties.</p>
        </div>
        <button id="closeJsonBtn" type="button" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-5 flex-1 overflow-y-auto space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <label class="inline-flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer text-slate-700">
            <i data-lucide="upload" class="w-3.5 h-3.5 text-indigo-600"></i>
            <span>Upload .json file</span>
            <input id="jsonFileInput" type="file" accept=".json,application/json" class="hidden" />
          </label>
          <button id="loadCurrentJsonBtn" type="button" class="text-xs font-medium text-indigo-600 hover:text-indigo-800">Load current dataset into editor</button>
        </div>
        <textarea id="jsonTextarea" rows="12" spellcheck="false" class="w-full p-3 text-xs mono bg-slate-950 text-emerald-300 rounded-xl border border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder='{"name": "root", "children": [{"name": "A", "value": 40}, {"name": "B", "children": [{"name": "B1", "value": 25}, {"name": "B2", "value": 35}]}]}'></textarea>
        <div id="jsonError" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></div>
      </div>
      <div class="px-5 py-3.5 border-t border-slate-100 flex items-center justify-end gap-2 bg-slate-50 rounded-b-2xl">
        <button id="cancelJsonBtn" type="button" class="px-3.5 py-1.5 text-sm font-medium text-slate-600 hover:text-slate-900">Cancel</button>
        <button id="applyJsonBtn" type="button" class="px-4 py-1.5 text-sm font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">Apply & Render</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg"></div>

    // =========================================================================
    // 2. APP STATE
    // =========================================================================
    const state = {
      datasetKey: "flare",
      customData: null,
      paletteKey: "rainbow",
      slowMo: false,
      searchQuery: "",
      root: null,
      currentFocus: null,
      colorScale: null,
      svgNode: null,
      clickedFn: null
    };

    const PALETTES = {
      rainbow: d3.interpolateRainbow,
      turbo: d3.interpolateTurbo,
      viridis: d3.interpolateViridis,
      warm: d3.interpolateWarm,
      cool: d3.interpolateCool
    };

    const formatNum = d3.format(",d");

    // =========================================================================
    // 3. DOM ELEMENTS
    // =========================================================================
    const chartContainer = document.getElementById("chartContainer");
    const breadcrumbNav = document.getElementById("breadcrumbNav");
    const datasetSelect = document.getElementById("datasetSelect");
    const paletteSelect = document.getElementById("paletteSelect");
    const slowMoToggle = document.getElementById("slowMoToggle");
    const resetZoomBtn = document.getElementById("resetZoomBtn");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const searchResults = document.getElementById("searchResults");
    const focusName = document.getElementById("focusName");
    const focusDepthBadge = document.getElementById("focusDepthBadge");
    const focusValue = document.getElementById("focusValue");
    const focusShare = document.getElementById("focusShare");
    const childCount = document.getElementById("childCount");
    const childrenList = document.getElementById("childrenList");
    const tooltip = document.getElementById("tooltip");
    const tooltipPath = document.getElementById("tooltipPath");
    const tooltipValue = document.getElementById("tooltipValue");
    const tooltipPercent = document.getElementById("tooltipPercent");
    const jsonModal = document.getElementById("jsonModal");
    const jsonTextarea = document.getElementById("jsonTextarea");
    const jsonError = document.getElementById("jsonError");
    const toast = document.getElementById("toast");

    // =========================================================================
    // 4. HELPER UTILITIES
    // =========================================================================
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add("hidden"), 2600);
    }

    function getActiveData() {
      if (state.datasetKey === "custom" && state.customData) {
        return state.customData;
      }
      return DATASETS[state.datasetKey] || DATASETS.flare;
    }

    function getNodeColor(d) {
      let node = d;
      while (node.depth > 1) node = node.parent;
      return state.colorScale(node.data.name);
    }

    // =========================================================================
    // 5. CORE D3 ZOOMABLE SUNBURST RENDERER
    // =========================================================================
    function renderSunburst() {
      const data = getActiveData();
      const width = 928;
      const height = width;
      const radius = width / 6;

      const interpolator = PALETTES[state.paletteKey] || d3.interpolateRainbow;
      const topCount = (data.children && data.children.length) ? data.children.length : 1;
      const color = d3.scaleOrdinal(d3.quantize(interpolator, topCount + 1));
      state.colorScale = color;

      const hierarchy = d3.hierarchy(data)
        .sum(d => d.value || 0)
        .sort((a, b) => b.value - a.value);

      const root = d3.partition()
        .size([2 * Math.PI, hierarchy.height + 1])(hierarchy);

      root.each(d => { d.current = d; });
      state.root = root;
      state.currentFocus = root;

      const arc = d3.arc()
        .startAngle(d => d.x0)
        .endAngle(d => d.x1)
        .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
        .padRadius(radius * 1.5)
        .innerRadius(d => d.y0 * radius)
        .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 1));

      const svg = d3.create("svg")
        .attr("viewBox", [-width / 2, -height / 2, width, width])
        .attr("class", "sunburst-svg")
        .style("font", "11px 'Inter', sans-serif");

      function arcVisible(d) {
        return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0;
      }

      function labelVisible(d) {
        return d.y1 <= 3 && d.y0 >= 1 && (d.y1 - d.y0) * (d.x1 - d.x0) > 0.03;
      }

      function labelTransform(d) {
        const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
        const y = (d.y0 + d.y1) / 2 * radius;
        return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
      }

      // Append arcs
      const path = svg.append("g")
        .selectAll("path")
        .data(root.descendants().slice(1))
        .join("path")
        .attr("class", "arc-path")
        .attr("fill", d => {
          let curr = d;
          while (curr.depth > 1) curr = curr.parent;
          return color(curr.data.name);
        })
        .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.68 : 0.44) : 0)
        .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
        .attr("d", d => arc(d.current));

      path.filter(d => d.children)
        .style("cursor", "pointer")
        .on("click", clicked);

      // Hover tooltip
      path
        .on("mouseenter", function (event, d) {
          if (!arcVisible(d.current)) return;
          const pathStr = d.ancestors().map(n => n.data.name).reverse().join(" / ");
          const pct = root.value ? ((d.value / root.value) * 100).toFixed(1) : "0.0";
          tooltipPath.textContent = pathStr;
          tooltipValue.textContent = formatNum(d.value);
          tooltipPercent.textContent = `${pct}%`;
          tooltip.classList.remove("hidden");
        })
        .on("mousemove", function (event) {
          const pad = 14;
          let left = event.clientX + pad;
          let top = event.clientY + pad;
          const rect = tooltip.getBoundingClientRect();
          if (left + rect.width > window.innerWidth - 8) {
            left = event.clientX - rect.width - pad;
          }
          if (top + rect.height > window.innerHeight - 8) {
            top = event.clientY - rect.height - pad;
          }
          tooltip.style.left = `${left}px`;
          tooltip.style.top = `${top}px`;
        })
        .on("mouseleave", function () {
          tooltip.classList.add("hidden");
        });

      // Labels
      const label = svg.append("g")
        .attr("pointer-events", "none")
        .attr("text-anchor", "middle")
        .style("user-select", "none")
        .selectAll("text")
        .data(root.descendants().slice(1))
        .join("text")
        .attr("dy", "0.35em")
        .attr("fill", "#0f172a")
        .attr("font-weight", d => d.children ? "600" : "400")
        .attr("fill-opacity", d => +labelVisible(d.current))
        .attr("transform", d => labelTransform(d.current))
        .text(d => {
          const name = d.data.name;
          return name.length > 18 ? name.slice(0, 16) + "…" : name;
        });

      // Center parent circle
      const parent = svg.append("circle")
        .datum(root)
        .attr("r", radius)
        .attr("fill", "#ffffff")
        .attr("fill-opacity", 0.92)
        .attr("stroke", "#e2e8f0")
        .attr("stroke-width", 1.5)
        .attr("pointer-events", "all")
        .style("cursor", "pointer")
        .on("click", clicked);

      // Center label group inside circle
      const centerGroup = svg.append("g")
        .attr("pointer-events", "none")
        .attr("text-anchor", "middle");

      const centerTitle = centerGroup.append("text")
        .attr("y", -10)
        .attr("font-size", "18px")
        .attr("font-weight", "700")
        .attr("fill", "#0f172a")
        .text(truncateLabel(root.data.name, 16));

      const centerVal = centerGroup.append("text")
        .attr("y", 14)
        .attr("font-size", "14px")
        .attr("font-weight", "600")
        .attr("fill", "#4f46e5")
        .text(formatNum(root.value));

      const centerHint = centerGroup.append("text")
        .attr("y", 36)
        .attr("font-size", "10px")
        .attr("fill", "#64748b")
        .text("Root level");

      function truncateLabel(str, max) {
        return str.length > max ? str.slice(0, max - 1) + "…" : str;
      }

      // Click / zoom handler
      function clicked(event, p) {
        if (!p) return;
        state.currentFocus = p;
        parent.datum(p.parent || root);

        centerTitle.text(truncateLabel(p.data.name, 16));
        centerVal.text(formatNum(p.value));
        centerHint.text(p === root ? "Root level" : "Click to zoom out");

        root.each(d => {
          d.target = {
            x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
            x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
            y0: Math.max(0, d.y0 - p.depth),
            y1: Math.max(0, d.y1 - p.depth)
          };
        });

        const useSlow = state.slowMo || (event && event.altKey);
        const t = svg.transition().duration(useSlow ? 7500 : 750);

        path.transition(t)
          .tween("data", d => {
            const i = d3.interpolate(d.current, d.target);
            return step => { d.current = i(step); };
          })
          .filter(function (d) {
            return +this.getAttribute("fill-opacity") || arcVisible(d.target);
          })
          .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.68 : 0.44) : 0)
          .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
          .attrTween("d", d => () => arc(d.current));

        label.filter(function (d) {
          return +this.getAttribute("fill-opacity") || labelVisible(d.target);
        }).transition(t)
          .attr("fill-opacity", d => +labelVisible(d.target))
          .attrTween("transform", d => () => labelTransform(d.current));

        updateInspector(p);
        applySearchHighlight();
      }

      state.svgNode = svg.node();
      state.clickedFn = clicked;

      chartContainer.innerHTML = "";
      chartContainer.appendChild(state.svgNode);

      updateInspector(root);
      applySearchHighlight();
    }

    // =========================================================================
    // 6. INSPECTOR, BREADCRUMBS & SEARCH
    // =========================================================================
    function updateInspector(node) {
      const root = state.root;
      if (!node || !root) return;

      // Breadcrumbs
      const ancestors = node.ancestors().reverse();
      breadcrumbNav.innerHTML = "";
      ancestors.forEach((anc, idx) => {
        if (idx > 0) {
          const sep = document.createElement("span");
          sep.className = "text-slate-300";
          sep.textContent = "/";
          breadcrumbNav.appendChild(sep);
        }
        const btn = document.createElement("button");
        btn.type = "button";
        const isLast = idx === ancestors.length - 1;
        btn.className = isLast
          ? "px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-700 font-semibold"
          : "px-2 py-0.5 rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition";
        btn.textContent = anc.data.name;
        if (!isLast) {
          btn.addEventListener("click", (e) => state.clickedFn(e, anc));
        }
        breadcrumbNav.appendChild(btn);
      });

      resetZoomBtn.disabled = (node === root);

      // Node summary
      focusName.textContent = node.data.name;
      focusDepthBadge.textContent = `Depth ${node.depth}`;
      focusValue.textContent = formatNum(node.value);
      const pct = root.value ? ((node.value / root.value) * 100).toFixed(1) : "0.0";
      focusShare.textContent = `${pct}%`;

      // Direct children list
      const kids = node.children ? [...node.children].sort((a, b) => b.value - a.value) : [];
      childCount.textContent = `${kids.length} ${kids.length === 1 ? "item" : "items"}`;
      childrenList.innerHTML = "";

      if (kids.length === 0) {
        const empty = document.createElement("div");
        empty.className = "text-xs text-slate-400 italic py-4 text-center";
        empty.textContent = "Leaf node — no nested segments.";
        childrenList.appendChild(empty);
        return;
      }

      kids.forEach(child => {
        const childPct = node.value ? ((child.value / node.value) * 100) : 0;
        const row = document.createElement("button");
        row.type = "button";
        const isClickable = Boolean(child.children);
        row.className = `w-full text-left p-2 rounded-xl border border-slate-100 transition ${isClickable ? "hover:bg-slate-50 hover:border-slate-200 cursor-pointer" : "cursor-default opacity-85"}`;
        const dotColor = getNodeColor(child);

        row.innerHTML = `
          <div class="flex items-center justify-between gap-2 text-xs mb-1">
            <span class="flex items-center gap-2 font-medium text-slate-800 truncate">
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${dotColor}"></span>
              <span class="truncate">${escapeHtml(child.data.name)}</span>
            </span>
            <span class="mono text-slate-600 shrink-0">${formatNum(child.value)} <span class="text-slate-400">(${childPct.toFixed(1)}%)</span></span>
          </div>
          <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full rounded-full" style="width:${Math.max(2, childPct)}%; background:${dotColor}; opacity:0.8"></div>
          </div>
        `;

        if (isClickable) {
          row.addEventListener("click", (e) => state.clickedFn(e, child));
        }
        childrenList.appendChild(row);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function applySearchHighlight() {
      if (!state.svgNode) return;
      const q = state.searchQuery.trim().toLowerCase();
      const paths = d3.select(state.svgNode).selectAll("path.arc-path");

      if (!q) {
        paths.classed("arc-dimmed", false).classed("arc-highlighted", false);
        searchResults.classList.add("hidden");
        searchResults.innerHTML = "";
        clearSearchBtn.classList.add("hidden");
        return;
      }

      clearSearchBtn.classList.remove("hidden");
      const matches = [];
      paths.each(function (d) {
        const hit = d.data.name.toLowerCase().includes(q);
        d3.select(this)
          .classed("arc-dimmed", !hit)
          .classed("arc-highlighted", hit);
        if (hit) matches.push(d);
      });

      searchResults.innerHTML = "";
      if (matches.length === 0) {
        searchResults.classList.remove("hidden");
        searchResults.innerHTML = `<div class="py-2 text-xs text-slate-400 text-center">No matching nodes found</div>`;
        return;
      }

      searchResults.classList.remove("hidden");
      matches.slice(0, 20).forEach(m => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "w-full text-left py-1.5 px-2 hover:bg-indigo-50 rounded-lg flex items-center justify-between gap-2 text-xs transition";
        const targetNode = m.children ? m : (m.parent || state.root);
        item.innerHTML = `
          <span class="truncate font-medium text-slate-800">${escapeHtml(m.data.name)}</span>
          <span class="mono text-slate-400 shrink-0">${formatNum(m.value)}</span>
        `;
        item.addEventListener("click", (e) => {
          state.clickedFn(e, targetNode);
        });
        searchResults.appendChild(item);
      });
    }

    // =========================================================================
    // 7. EVENT LISTENERS
    // =========================================================================
    datasetSelect.addEventListener("change", (e) => {
      state.datasetKey = e.target.value;
      renderSunburst();
      showToast(`Loaded "${getActiveData().name}"`);
    });

    paletteSelect.addEventListener("change", (e) => {
      state.paletteKey = e.target.value;
      renderSunburst();
    });

    slowMoToggle.addEventListener("click", () => {
      state.slowMo = !state.slowMo;
      slowMoToggle.setAttribute("aria-pressed", String(state.slowMo));
      slowMoToggle.className = state.slowMo
        ? "inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-md border border-indigo-300 bg-indigo-50 text-indigo-700 transition"
        : "inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50 transition";
      slowMoToggle.querySelector("span").textContent = state.slowMo ? "Slow-Mo: On" : "Slow-Mo: Off";
    });

    resetZoomBtn.addEventListener("click", (e) => {
      if (state.root && state.clickedFn) {
        state.clickedFn(e, state.root);
      }
    });

    searchInput.addEventListener("input", (e) => {
      state.searchQuery = e.target.value;
      applySearchHighlight();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      state.searchQuery = "";
      applySearchHighlight();
    });

    // Export SVG
    document.getElementById("exportSvgBtn").addEventListener("click", () => {
      if (!state.svgNode) return;
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(state.svgNode);
      const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${getActiveData().name.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-sunburst.svg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("SVG downloaded");
    });

    // Custom JSON Modal
    function openModal() {
      jsonError.classList.add("hidden");
      jsonModal.classList.remove("hidden");
      jsonModal.classList.add("flex");
    }

    function closeModal() {
      jsonModal.classList.add("hidden");
      jsonModal.classList.remove("flex");
    }

    document.getElementById("openJsonBtn").addEventListener("click", openModal);
    document.getElementById("closeJsonBtn").addEventListener("click", closeModal);
    document.getElementById("cancelJsonBtn").addEventListener("click", closeModal);

    document.getElementById("loadCurrentJsonBtn").addEventListener("click", () => {
      jsonTextarea.value = JSON.stringify(getActiveData(), null, 2);
      jsonError.classList.add("hidden");
    });

    document.getElementById("jsonFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        jsonTextarea.value = reader.result;
        jsonError.classList.add("hidden");
      };
      reader.readAsText(file);
    });

    document.getElementById("applyJsonBtn").addEventListener("click", () => {
      try {
        const parsed = JSON.parse(jsonTextarea.value);
        if (!parsed || typeof parsed !== "object" || !parsed.name) {
          throw new Error("Root object must have a 'name' property.");
        }
        state.customData = parsed;
        if (!datasetSelect.querySelector('option[value="custom"]')) {
          const opt = document.createElement("option");
          opt.value = "custom";
          opt.textContent = "Custom JSON";
          datasetSelect.appendChild(opt);
        }
        datasetSelect.value = "custom";
        state.datasetKey = "custom";
        closeModal();
        renderSunburst();
        showToast("Custom JSON rendered");
      } catch (err) {
        jsonError.textContent = err.message || "Invalid JSON format.";
        jsonError.classList.remove("hidden");
      }
    });

    // =========================================================================
    // 8. INIT
    // =========================================================================
    window.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) {
        lucide.createIcons();
      }
      renderSunburst();
    });
  </script>
